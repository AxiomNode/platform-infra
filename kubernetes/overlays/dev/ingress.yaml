apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: axiomnode-ingress
  labels:
    app.kubernetes.io/part-of: axiomnode
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Public backoffice frontend (via Nginx Proxy Manager)
    - match: Host(`axiomnode-backoffice.amksandbox.cloud`)
      kind: Rule
      services:
        - name: backoffice
          port: 80

    # Public API gateway entry (used by backoffice/mobile edge clients)
    # Only explicit public paths reach the gateway. /internal/* (ai-engine and
    # admin routes), /metrics and /monitor/* are NOT routed publicly: Traefik
    # answers 404 for them. In-cluster callers use http://api-gateway:7005.
    - match: Host(`axiomnode-gateway.amksandbox.cloud`) && (Path(`/health`) || PathPrefix(`/v1/`))
      kind: Rule
      services:
        - name: api-gateway
          port: 7005
